<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLIT Staff IT Inventory Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --sp-purple: #6b469b;
      --text-main: #0f172a;
      --text-muted: #475569;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-main);
      padding: 20px;
      margin: 0;
    }

    .dashboard-card {
      background: rgba(248, 249, 252, 0.75);
      border-radius: 16px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 8px 30px 0 rgba(107, 70, 155, 0.06);
      padding: 20px;
      height: 100%;
    }

    .filter-group { flex: 1; min-width: 140px; }
    .filter-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .form-select, .form-control { background: #fff; border-radius: 10px; border: 1px solid rgba(107, 70, 155, 0.18); padding: 7px 12px; font-size: 0.88rem; font-weight: 600; }
    
    .btn-reset {
      background: linear-gradient(135deg, #6b469b 0%, #4a2e71 100%);
      color: #fff; font-weight: 600; font-size: 0.75rem; border-radius: 10px; padding: 9px 20px; border: none;
    }

    .btn-reset:hover {
      background: linear-gradient(135deg, #593983 0%, #3d255e 100%);
      color: #fff;
    }

    .kpi-title { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .kpi-value { font-family: 'Lora', Georgia, serif; font-size: 1.75rem; font-weight: 700; margin-top: 6px; }

    .border-accent-purple { border-left: 5px solid #6b469b !important; }
    .border-accent-blue   { border-left: 5px solid #2563eb !important; }
    .border-accent-green  { border-left: 5px solid #16a34a !important; }
    .border-accent-indigo { border-left: 5px solid #4f46e5 !important; }

    .chart-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 14px; }
    .chart-container { position: relative; width: 100%; height: 210px; }

    .badge-status { font-weight: 600; padding: 5px 12px; border-radius: 12px; font-size: 0.75rem; }
    .badge-inuse { background-color: #dbeafe; color: #1e40af; }
    .badge-instock { background-color: #dcfce7; color: #166534; }
    .badge-repair { background-color: #e0e7ff; color: #3730a3; }
    .badge-default { background-color: #f1f5f9; color: #475569; }

    .table-responsive { max-height: 320px; overflow-y: auto; }
    .custom-table { font-size: 0.85rem; margin-bottom: 0; }
    .custom-table th { background: #f1f5f9; position: sticky; top: 0; z-index: 2; font-weight: 600; text-transform: uppercase; font-size: 0.72rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container-fluid px-0">
    <!-- Filters -->
    <div class="dashboard-card mb-3">
      <div class="d-flex align-items-end justify-content-between flex-wrap gap-3">
        <div class="filter-group">
          <div class="filter-label">Company</div>
          <select id="filter-company" class="form-select" onchange="applyFilters()"><option value="All">All</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Work Base</div>
          <select id="filter-workbase" class="form-select" onchange="applyFilters()"><option value="All">All</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Status</div>
          <select id="filter-status" class="form-select" onchange="applyFilters()"><option value="All">All</option></select>
        </div>
        <div class="ms-auto">
          <button class="btn btn-reset text-uppercase" onclick="resetFilters()">Reset Filters</button>
        </div>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <div class="dashboard-card border-accent-purple">
          <div class="kpi-title" style="color: #6b469b;">Total Staff Records</div>
          <div class="kpi-value" id="kpi-total">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="dashboard-card border-accent-blue">
          <div class="kpi-title" style="color: #2563eb;">In Use</div>
          <div class="kpi-value" id="kpi-inuse">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="dashboard-card border-accent-green">
          <div class="kpi-title" style="color: #16a34a;">In Stock / Available</div>
          <div class="kpi-value" id="kpi-instock">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="dashboard-card border-accent-indigo">
          <div class="kpi-title" style="color: #4f46e5;">Under Repair</div>
          <div class="kpi-value" id="kpi-repair">0</div>
        </div>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="dashboard-card">
          <div class="chart-title">Status Split</div>
          <div class="chart-container"><canvas id="chartStatus"></canvas></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="dashboard-card">
          <div class="chart-title">Company Breakdown</div>
          <div class="chart-container"><canvas id="chartCompany"></canvas></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="dashboard-card">
          <div class="chart-title">Work Base Distribution</div>
          <div class="chart-container"><canvas id="chartWorkbase"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Search Bar & Staff Inventory Table (Under Charts) -->
    <div class="dashboard-card">
      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <div class="chart-title mb-0">RLIT Staff IT Inventory</div>
        <div style="width: 340px; max-width: 100%;">
          <input type="text" id="filter-search" class="form-control" placeholder="Search staff name" oninput="applyFilters()">
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle custom-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Company</th>
              <th>Staff ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Designation</th>
              <th>Work Base</th>
            </tr>
          </thead>
          <tbody id="inventory-table-body">
            <tr><td colspan="7" class="text-center text-muted py-3">Loading inventory records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = { pollIntervalSeconds: 30 };
    const PALETTE = ["#6b469b", "#0284c7", "#0d9488", "#ea580c", "#4f46e5", "#059669", "#d97706", "#475569", "#2563eb"];

    let rawListItems = [];
    let chartStatusInstance = null;
    let chartCompanyInstance = null;
    let chartWorkbaseInstance = null;

    function parseFieldValue(val) {
      if (val === null || val === undefined) return "N/A";
      if (typeof val === 'object') {
        if (val.Value !== undefined) return val.Value;
        if (val.value !== undefined) return val.value;
        if (val.Email !== undefined) return val.Email;
        if (Array.isArray(val.results)) return val.results.join(', ');
      }
      const str = String(val).trim();
      return (str === "" || str === "null" || str === "undefined") ? "N/A" : str;
    }

    async function fetchLocalData() {
      const DATA_URL = `https://hajaru-hub.github.io/Test1/data.json?t=${Date.now()}`;
      const response = await fetch(DATA_URL, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: Unable to fetch data.json`);
      }
      const raw = await response.json();
      
      if (Array.isArray(raw)) return raw;
      if (raw.data && Array.isArray(raw.data)) return raw.data;
      if (raw.value && Array.isArray(raw.value)) return raw.value;
      return [];
    }

    async function loadData() {
      try {
        const items = await fetchLocalData();

        rawListItems = items.map(item => ({
          ID: item.ID || item.No || item.Id,
          Status: parseFieldValue(item.Status || item.STATUS),
          Company: parseFieldValue(item.Company || item.COMPANY),
          StaffID: parseFieldValue(item.StaffID || item.STAFF_x0020_ID || item['STAFF ID']),
          Name: parseFieldValue(item.Name || item.NAME || item.Title),
          Email: parseFieldValue(item.Email || item.EMAIL),
          Designation: parseFieldValue(item.Designation || item.DESIGNATION),
          Workbase: parseFieldValue(item.Workbase || item.WorkBase || item['WORK BASE'] || item.WORK_x0020_BASE || item.Work_x0020_Base)
        }));

        populateFilterDropdowns(rawListItems);
        applyFilters();
      } catch (error) {
        console.error(error);
      }
    }

    function populateFilterDropdowns(items) {
      const cSel = document.getElementById("filter-company");
      const wSel = document.getElementById("filter-workbase");
      const sSel = document.getElementById("filter-status");

      const currC = cSel.value, currW = wSel.value, currS = sSel.value;

      const companies = ["All", ...new Set(items.map(i => i.Company))].sort();
      const workbases = ["All", ...new Set(items.map(i => i.Workbase))].sort();
      const statuses  = ["All", ...new Set(items.map(i => i.Status))].sort();

      cSel.innerHTML = companies.map(c => `<option value="${c}">${c}</option>`).join("");
      wSel.innerHTML = workbases.map(w => `<option value="${w}">${w}</option>`).join("");
      sSel.innerHTML = statuses.map(s => `<option value="${s}">${s}</option>`).join("");

      if (companies.includes(currC)) cSel.value = currC;
      if (workbases.includes(currW)) wSel.value = currW;
      if (statuses.includes(currS))  sSel.value = currS;
    }

    function applyFilters() {
      const searchVal = document.getElementById("filter-search").value.toLowerCase().trim();
      const cVal = document.getElementById("filter-company").value;
      const wVal = document.getElementById("filter-workbase").value;
      const sVal = document.getElementById("filter-status").value;

      const filtered = rawListItems.filter(item => {
        const textMatch = !searchVal || 
          item.Name.toLowerCase().includes(searchVal) ||
          item.StaffID.toLowerCase().includes(searchVal) ||
          item.Email.toLowerCase().includes(searchVal) ||
          item.Designation.toLowerCase().includes(searchVal) ||
          item.Company.toLowerCase().includes(searchVal) ||
          item.Workbase.toLowerCase().includes(searchVal);

        const cMatch = cVal === "All" || item.Company === cVal;
        const wMatch = wVal === "All" || item.Workbase === wVal;
        const sMatch = sVal === "All" || item.Status === sVal;

        return textMatch && cMatch && wMatch && sMatch;
      });

      updateKPIs(filtered);
      renderTable(filtered);
      if (typeof Chart !== 'undefined') renderCharts(filtered);
    }

    function resetFilters() {
      document.getElementById("filter-search").value = "";
      document.getElementById("filter-company").value = "All";
      document.getElementById("filter-workbase").value = "All";
      document.getElementById("filter-status").value = "All";
      applyFilters();
    }

    function updateKPIs(items) {
      document.getElementById("kpi-total").innerText = items.length;
      document.getElementById("kpi-inuse").innerText = items.filter(i => i.Status.toLowerCase() === "in use").length;
      document.getElementById("kpi-instock").innerText = items.filter(i => ["in stock", "available"].includes(i.Status.toLowerCase())).length;
      document.getElementById("kpi-repair").innerText = items.filter(i => i.Status.toLowerCase() === "repair").length;
    }

    function getBadgeClass(status) {
      const s = status.toLowerCase();
      if (s === "in use") return "badge-inuse";
      if (s === "in stock" || s === "available") return "badge-instock";
      if (s === "repair") return "badge-repair";
      return "badge-default";
    }

    function renderTable(items) {
      const tbody = document.getElementById("inventory-table-body");
      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">No matching staff records found</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => `
        <tr>
          <td><span class="badge-status ${getBadgeClass(item.Status)}">${item.Status}</span></td>
          <td>${item.Company}</td>
          <td class="fw-bold">${item.StaffID}</td>
          <td class="fw-bold">${item.Name}</td>
          <td>${item.Email}</td>
          <td>${item.Designation}</td>
          <td>${item.Workbase}</td>
        </tr>
      `).join("");
    }

    function countByProperty(items, prop) {
      return items.reduce((acc, curr) => { const v = curr[prop] || "N/A"; acc[v] = (acc[v] || 0) + 1; return acc; }, {});
    }

    function renderCharts(items) {
      const labelFont = { family: "'Segoe UI', sans-serif", size: 10, weight: "600" };
      const numberFont = { family: "'Lora', Georgia, serif", size: 10, weight: "600" };

      const statusCounts = countByProperty(items, "Status");
      const ctxStatus = document.getElementById("chartStatus").getContext("2d");
      if (chartStatusInstance) chartStatusInstance.destroy();
      chartStatusInstance = new Chart(ctxStatus, {
        type: "doughnut",
        data: { labels: Object.keys(statusCounts), datasets: [{ data: Object.values(statusCounts), backgroundColor: ["#2563eb", "#16a34a", "#4f46e5", "#dc2626"], borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { font: labelFont, color: "#0f172a", boxWidth: 12 } } } }
      });

      const compCounts = countByProperty(items, "Company");
      const ctxComp = document.getElementById("chartCompany").getContext("2d");
      if (chartCompanyInstance) chartCompanyInstance.destroy();
      chartCompanyInstance = new Chart(ctxComp, {
        type: "bar",
        data: { labels: Object.keys(compCounts), datasets: [{ data: Object.values(compCounts), backgroundColor: "#6b469b", borderRadius: 4 }] },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { stepSize: 1, font: numberFont } }, y: { ticks: { font: labelFont } } } }
      });

      const wbCounts = countByProperty(items, "Workbase");
      const ctxWb = document.getElementById("chartWorkbase").getContext("2d");
      if (chartWorkbaseInstance) chartWorkbaseInstance.destroy();
      chartWorkbaseInstance = new Chart(ctxWb, {
        type: "pie",
        data: { labels: Object.keys(wbCounts), datasets: [{ data: Object.values(wbCounts), backgroundColor: PALETTE.slice(0, Object.keys(wbCounts).length), borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { font: labelFont, color: "#0f172a", boxWidth: 12 } } } }
      });
    }

    window.onload = () => {
      loadData();
      setInterval(loadData, CONFIG.pollIntervalSeconds * 1000);
    };
  </script>
</body>
</html>
