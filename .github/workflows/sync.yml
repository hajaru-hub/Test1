name: sync

on:
  repository_dispatch:
    types: [sync-data]
  workflow_dispatch:

concurrency:
  group: sync-data-job
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save data.json from payload
        run: |
          if [ -n '${{ github.event.client_payload.data }}' ]; then
            echo '${{ github.event.client_payload.data }}' > data.json
          fi

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update data.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in data.json"
          fi
